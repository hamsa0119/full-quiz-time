spring.application.name=exam

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/quiztime
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.address=0.0.0.0
server.port=8085

# Response Compression to improve Cloud Latency
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# SMTP Configuration (Update these for emails to work)
# Use Google App Password for SMTP_PASS if using Gmail
SMTP_USER=YOUR_EMAIL@gmail.com
SMTP_PASS=YOUR_APP_PASSWORD
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
